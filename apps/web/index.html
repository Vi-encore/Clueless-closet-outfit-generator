<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover lets the page reach under a notch, which is what makes
         env(safe-area-inset-*) mean anything. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Clueless Closet</title>
    <meta name="theme-color" content="#7b2d8e" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <!-- An iPhone reads none of the manifest's icons, nor its standalone display: these
         say the same to Safari. The status bar is translucent so that the plaid runs
         under it, and the shell's top padding keeps the windows out of it. -->
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon-180.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Closet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
