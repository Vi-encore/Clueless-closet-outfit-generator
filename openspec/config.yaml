schema: spec-driven

# Constraints an agent cannot infer from the code. Background docs live in docs/.
context: |
  Clueless Closet: a multi-user digital wardrobe and outfit generator, a PWA for phone and desktop.
  Status: roadmap step 1 (packages/core) is done; no API or UI yet. Background docs are in docs/ (English):
  start with docs/README.md and docs/roadmap.md. docs/uk/ is a frozen Ukrainian archive: never edit it or use it as a source.

  Learning project: the author writes the application code (apps/, packages/) to learn NestJS.
  Claude plans, gives pointers and reviews. Exception: Claude writes the tests, from the spec scenarios,
  before the author implements. Claude writes application code only when the author asks for it
  ("покажи рішення" / "напиши й поясни"); the author may switch a whole step to that mode.

  Languages: chat with the author is Ukrainian; every OpenSpec artifact and doc is English;
  user-facing UI strings are Ukrainian.

  Decided stack: pnpm workspaces monorepo; packages/core is pure TypeScript (domain + outfit algorithm,
  Vitest, no Nest or database imports); apps/api is NestJS + Prisma + PostgreSQL (Neon); apps/web is
  React + Vite PWA with 98.css + Tailwind v4. Files go to S3-compatible storage through presigned URLs
  (Backblaze B2 for the PoC). Auto-tagging goes through a TaggingProvider interface (Gemini free tier).

  Budget: the proof of concept must cost nothing and need no payment card on any service.

  Conventions: UUID ids; timestamptz; item tag vocabularies are defined once in packages/core and
  everything else derives from them; the database stores codes and the UI dictionary holds labels.
  Every query on user data is scoped to its owner (IDOR protection is mandatory).
  Privacy: photos of people and body measurements are never sent to AI providers and are not shared by default.

  Roadmap: each step in docs/roadmap.md maps to one change id listed there.

rules:
  proposal:
    - Base the proposal on the matching step in docs/roadmap.md and link docs/ sections instead of restating them.
    - State what is out of scope, especially work that belongs to later roadmap steps.
    - Keep a change to about 10 requirements or fewer; split a bigger roadmap step into several changes.
  specs:
    - Write behavior a test can verify; each scenario maps to one unit or e2e test (Claude writes the tests).
  design:
    - Write design.md as the step's learning pointers - decisions with alternatives, target module and file structure, signatures as orientation, official docs to read, and common pitfalls.
    - Do not include complete implementations of application code.
  tasks:
    - Start each task group with a task for Claude to write that group's tests (describe = requirement name, it = scenario name); the remaining tasks are implementation work the author does, verified by those tests or another concrete check.
    - Keep each task small enough for one evening.

operations:
  apply:
    guidance:
      - The author normally implements tasks personally. Running apply is a request for a ready solution, so first confirm with the author which tasks they want solved.
      - When reviewing the author's work ("перевір"), mark a task done only after it passes review.
  archive:
    guidance:
      - Before archiving, confirm every scenario in the delta specs is covered by a passing test or an explicit manual check.
      - The author agreed to automatic archiving. Archive without asking once all tasks are ticked, tests and the type check are green, validate --strict passes, every scenario has a test, and the last review passed; then commit and push to the dev branch and report what moved into openspec/specs/. Hold if the author said "не архівуй".
