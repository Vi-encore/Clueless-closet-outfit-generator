schema: spec-driven

# Constraints an agent cannot infer from the code. Background docs live in docs/.
context: |
  Clueless Closet: a multi-user digital wardrobe and outfit generator, a PWA for phone and desktop.
  Status: roadmap steps 1 to 4 are done - packages/core and apps/api, a NestJS 12 ESM app with
  GET /health, settings validated from the environment, global zod validation, POST /outfits/score,
  Swagger at /docs, and PostgreSQL in Docker Compose with Prisma 7, holding User and Item.
  Step 4 added accounts and authentication: argon2 passwords, a short JWT access token, a rotating
  refresh token stored only as a hash, a global guard with @Public for the open routes, and
  AuthService.verifyAccessToken for callers outside HTTP. The documentation is not served when
  NODE_ENV is production, and it carries a bearer scheme that @Public lifts, so the padlocks follow
  the guard. Step 5 added the wardrobe itself: POST/GET/PATCH/DELETE on /items, every query
  scoped to the owner, somebody else's item answered 404 rather than 403, and DELETE archiving
  rather than removing. Step 6 is split in two changes: `add-friends` is done - requests, blocking,
  one Friendship row per sorted pair, and a friend reading the items marked `friends` - and `add-chat`
  is done too: a Socket.IO gateway that identifies a connection in handshake middleware rather than in
  handleConnection, a conversation created by its first message, messages stored under an id the client
  generates so a resend is not a second message, history and catching up over REST. Step 7 is next.
  Step 7 added photo storage: a StorageService over the S3 API, presigned URLs in both directions,
  a key that names its owner so a captured one is useless, and a link to the photograph on every item
  the API returns. Tests run against a local object store in Compose (Chainguard's MinIO rebuild);
  Backblaze B2 is a change of settings. Step 8, the web client, is next.
  `close-known-gaps` tidied four things:
  emails are normalised before storage and lookup, both item list routes answer `{ items, nextCursor }`
  rather than an array, `issue()` clears a user's expired refresh tokens, and rate limiting is on with
  `TRUST_PROXY` deciding who the caller is. There is no UI yet. Tests that need the database are a
  separate script, test:db; pnpm test runs without a container. Background docs are in docs/ (English):
  start with docs/README.md and docs/roadmap.md. docs/uk/ is a frozen Ukrainian archive: never edit it or use it as a source.

  Learning project: the author writes the application code (apps/, packages/) to learn NestJS.
  Claude plans, gives pointers and reviews. Exception: Claude writes the tests, from the spec scenarios,
  before the author implements. Claude writes application code only when the author asks for it
  ("покажи рішення" / "напиши й поясни"); the author may switch a whole step to that mode.
  Steps 2 to 5 were switched that way: Claude writes the application code and explains it, while the
  author steers the decisions and reviews. Do not assume a later step works the same way; ask.

  Languages: chat with the author is Ukrainian; every OpenSpec artifact and doc is English;
  user-facing UI strings are Ukrainian.

  Decided stack: pnpm workspaces monorepo; packages/core is pure TypeScript (domain + outfit algorithm,
  Vitest, no Nest or database imports); apps/api is NestJS + Prisma + PostgreSQL (Neon); apps/web is
  React + Vite PWA with 98.css + Tailwind v4. Files go to S3-compatible storage through presigned URLs
  (Backblaze B2 for the PoC). Auto-tagging goes through a TaggingProvider interface (Gemini free tier).

  Budget: the proof of concept must cost nothing and need no payment card on any service.

  Conventions: UUID ids; timestamptz; item tag vocabularies are defined once in packages/core and
  everything else derives from them; the database stores codes and the UI dictionary holds labels.
  Every query on user data is scoped to its owner (IDOR protection is mandatory).
  Privacy: photos of people and body measurements are never sent to AI providers and are not shared by default.

  Where code lives: a service file holds its service. Interfaces that name a module's vocabulary go
  in <module>.interfaces.ts beside it; anything two files could want, or that takes a paragraph to
  explain, gets its own module (src/pagination.ts, src/sorted-pair.ts, src/prisma/errors.ts are the
  existing ones). This is not "no types in a service" - a type used by one service and its controller
  is fine where it is. It is a reaction to what happened twice: a helper written inside the service
  that first needed it, then written again, differently, by the next service that needed the same
  rule. Check those three modules before writing a helper. A file is named for its module, a URL for
  its resource, so chat.controller.ts can serve /conversations.

  Decisions: a change records its own in its design.md. A decision that will bind work beyond that
  change also gets a record in docs/adr/ - numbered, never edited once accepted, superseded by a new
  one when it changes. Read docs/adr/README.md before proposing something that contradicts one.

  Roadmap: each step in docs/roadmap.md maps to one change id listed there.

rules:
  proposal:
    - Base the proposal on the matching step in docs/roadmap.md and link docs/ sections instead of restating them.
    - State what is out of scope, especially work that belongs to later roadmap steps.
    - Keep a change to about 10 requirements or fewer; split a bigger roadmap step into several changes.
  specs:
    - Write behavior a test can verify; each scenario maps to one unit or e2e test (Claude writes the tests).
  design:
    - Write design.md as the step's learning pointers - decisions with alternatives, target module and file structure, signatures as orientation, official docs to read, and common pitfalls.
    - Do not include complete implementations of application code.
  tasks:
    - Start each task group with a task for Claude to write that group's tests (describe = requirement name, it = scenario name); the remaining tasks are implementation work the author does, verified by those tests or another concrete check.
    - Keep each task small enough for one evening.

operations:
  apply:
    guidance:
      - The author normally implements tasks personally. Running apply is a request for a ready solution, so first confirm with the author which tasks they want solved.
      - When reviewing the author's work ("перевір"), mark a task done only after it passes review.
  archive:
    guidance:
      - Before archiving, confirm every scenario in the delta specs is covered by a passing test or an explicit manual check.
      - The author agreed to automatic archiving. Archive without asking once all tasks are ticked, tests and the type check are green, validate --strict passes, every scenario has a test, and the last review passed; then commit and push to the dev branch and report what moved into openspec/specs/. Hold if the author said "не архівуй".
