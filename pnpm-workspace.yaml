packages:
  # applications: web (React PWA), api (NestJS)
  - 'apps/*'
  # shared libraries: core (domain types and the outfit algorithm)
  - 'packages/*'

# Dependencies allowed to run install/build scripts (pnpm blocks the rest).
# Add entries with `pnpm approve-builds` when an install asks for it.
allowBuilds:
  # Install-time analytics, pulled in by swagger-ui-dist. It reports home on
  # install and nothing needs it, so it is denied on purpose, not just unapproved.
  '@scarf/scarf': false
  # Prisma's own install scripts place the binaries its CLI runs migrations with.
  # Allowed deliberately: without them `prisma migrate` has nothing to execute.
  'prisma': true
  '@prisma/engines': true
